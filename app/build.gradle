plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing/signing.properties')
def releaseSigning = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'dev.steamy.bitcointicker'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.steamy.bitcointicker'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '2.5.2'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

tasks.register('signReleaseApk', Exec) {
    group = 'build'
    description = 'Builds and signs the release APK with apksigner 34 for F-Droid reproducibility.'
    dependsOn 'assembleRelease'

    doFirst {
        if (releaseSigning.isEmpty()) {
            throw new GradleException('signing/signing.properties is required for signReleaseApk')
        }

        def apksigner = new File(android.sdkDirectory, 'build-tools/34.0.0/apksigner')
        if (!apksigner.canExecute()) {
            throw new GradleException('Android SDK Build Tools 34.0.0 is required for reproducible signing')
        }

        def unsignedApk = layout.buildDirectory.file(
                'outputs/apk/release/app-release-unsigned.apk').get().asFile
        def signedApk = layout.buildDirectory.file(
                'outputs/apk/release/app-release.apk').get().asFile
        environment 'APK_KS_PASS', releaseSigning['storePassword']
        environment 'APK_KEY_PASS', releaseSigning['keyPassword']
        commandLine apksigner.absolutePath,
                'sign',
                '--ks', rootProject.file(releaseSigning['storeFile']).absolutePath,
                '--ks-key-alias', releaseSigning['keyAlias'],
                '--ks-pass', 'env:APK_KS_PASS',
                '--key-pass', 'env:APK_KEY_PASS',
                '--v4-signing-enabled', 'false',
                '--out', signedApk.absolutePath,
                unsignedApk.absolutePath
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
